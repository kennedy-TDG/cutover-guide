<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div ref="{{ rootRef }}" data-tgt="{{ tgt }}" style="position:relative;width:100%;font-family:'Oracle Sans',-apple-system,'Segoe UI','Helvetica Neue',Arial,sans-serif;">
  <div style="{{ boxStyle }}" onClick="{{ onBoxClick }}">
    <div style="{{ labelStyle }}">{{ label }}</div>
    <sc-if value="{{ isText }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;align-items:center;gap:4px;">
        <sc-if value="{{ showPrefix }}"><span style="font-size:17px;color:#161513;">{{ prefix }}</span></sc-if>
        <input value="{{ val }}" onChange="{{ onInput }}" onFocus="{{ onFocus }}" onBlur="{{ onBlur }}" style="{{ inputStyle }}">
      </div>
    </sc-if>
    <sc-if value="{{ isArea }}">
      <textarea value="{{ val }}" onChange="{{ onInput }}" onFocus="{{ onFocus }}" onBlur="{{ onBlur }}" style="{{ areaStyle }}"></textarea>
    </sc-if>
    <sc-if value="{{ isSelect }}">
      <div style="{{ selValStyle }}">{{ val }}</div>
      <svg sc-camel-view-box="0 0 24 24" style="position:absolute;right:18px;top:50%;width:20px;height:20px;margin-top:-10px;fill:#161513;"><path d="M7 10l5 5 5-5z"></path></svg>
    </sc-if>
    <sc-if value="{{ isRead }}">
      <div style="font-size:17px;color:#161513;white-space:nowrap;overflow:hidden;text-overflow:clip;">{{ val }}</div>
    </sc-if>
    <sc-if value="{{ iconCal }}">
      <svg sc-camel-view-box="0 0 24 24" style="position:absolute;right:16px;top:50%;width:20px;height:20px;margin-top:-10px;fill:none;stroke:#161513;stroke-width:1.5;"><rect x="3.5" y="5" width="17" height="15" rx="1"></rect><path d="M3.5 9.5h17M8 3v4M16 3v4M7 13h2M11 13h2M15 13h2M7 16.5h2M11 16.5h2M15 16.5h2"></path></svg>
    </sc-if>
    <sc-if value="{{ iconExt }}">
      <svg sc-camel-view-box="0 0 24 24" style="position:absolute;right:16px;top:50%;width:20px;height:20px;margin-top:-10px;fill:none;stroke:#161513;stroke-width:1.6;"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"></path></svg>
    </sc-if>
  </div>
  <sc-if value="{{ showRequired }}">
    <div style="text-align:right;font-size:13px;color:#5b5652;margin-top:5px;">Required</div>
  </sc-if>
  <sc-if value="{{ open }}">
    <div style="position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border-radius:4px;box-shadow:0 4px 16px rgba(0,0,0,.18);z-index:20;max-height:300px;overflow:auto;padding:4px 0;">
      <sc-for list="{{ items }}" as="it" hint-placeholder-count="3">
        <div onClick="{{ it.pick }}" style="{{ it.style }}" style-hover="background:#f1efed;">{{ it.label }}</div>
      </sc-for>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:480,&quot;height&quot;:120},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Item Description&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;text&quot;,&quot;textarea&quot;,&quot;select&quot;,&quot;readonly&quot;],&quot;default&quot;:&quot;text&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;required&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;options&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[]&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(v:string)=&gt;void&quot;},&quot;tgt&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;height&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:54,&quot;tsType&quot;:&quot;number&quot;},&quot;prefix&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;icon&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;cal&quot;,&quot;ext&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;muted&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { focus: false, open: false };
  rootRef = React.createRef();
  componentDidMount() {
    this._doc = (e) => { if (this.state.open && this.rootRef.current && !this.rootRef.current.contains(e.target)) this.setState({ open: false }); };
    document.addEventListener('mousedown', this._doc);
  }
  componentWillUnmount() { document.removeEventListener('mousedown', this._doc); }
  renderVals() {
    const p = this.props;
    const kind = p.kind || 'text';
    const val = p.value == null ? '' : String(p.value);
    const has = val !== '';
    const focus = this.state.focus || this.state.open;
    const muted = p.tone === 'muted';
    const read = kind === 'readonly';
    const h = parseInt(p.height || (kind === 'textarea' ? 108 : 54), 10);
    const floatUp = has || this.state.focus || kind === 'textarea';
    const big = !has && !this.state.focus;
    const boxStyle = {
      position: 'relative', boxSizing: 'border-box', minHeight: h + 'px', height: kind === 'textarea' ? h + 'px' : h + 'px',
      background: read ? '#f5f3f1' : (muted ? '#fbf9f8' : '#fff'),
      border: focus ? '1px solid #2c5a7e' : (read || muted ? '1px solid #c9c5c0' : '1px solid #8d8883'),
      boxShadow: focus ? 'inset 0 0 0 1px #2c5a7e' : 'none',
      borderRadius: '4px', padding: kind === 'textarea' ? '18px 17px 10px' : (floatUp && !(kind === 'select' && !has) ? '9px 46px 6px 17px' : '0 46px 0 17px'),
      display: 'flex', flexDirection: 'column', justifyContent: kind === 'textarea' ? 'flex-start' : 'center',
      cursor: kind === 'select' ? 'pointer' : (read ? 'default' : 'text')
    };
    const labelStyle = (kind === 'textarea' && !has && !this.state.focus) || (kind !== 'textarea' && big && kind !== 'readonly')
      ? { fontSize: '16px', color: '#4f4b47', fontWeight: 500, lineHeight: '20px', pointerEvents: 'none', marginBottom: kind === 'textarea' ? '6px' : 0 }
      : { fontSize: '13px', color: '#4f4b47', fontWeight: 500, lineHeight: '16px', pointerEvents: 'none', marginBottom: '1px' };
    const showInput = kind === 'text' && (has || this.state.focus);
    const opts = p.options || [];
    return {
      rootRef: this.rootRef, tgt: p.tgt || '', label: p.label || '', val, prefix: p.prefix || '',
      boxStyle, labelStyle,
      isText: kind === 'text', isArea: kind === 'textarea', isSelect: kind === 'select' && has, isRead: read,
      showPrefix: !!p.prefix && (has || this.state.focus),
      iconCal: p.icon === 'cal', iconExt: p.icon === 'ext',
      inputStyle: { border: 'none', outline: 'none', background: 'transparent', fontSize: '17px', color: '#161513', padding: 0, width: '100%', fontFamily: 'inherit', height: showInput ? '22px' : '0px', opacity: showInput ? 1 : 0 },
      areaStyle: { border: 'none', outline: 'none', background: 'transparent', fontSize: '17px', color: '#161513', padding: 0, width: '100%', flex: 1, resize: 'none', fontFamily: 'inherit', lineHeight: '22px' },
      selValStyle: { fontSize: '17px', color: '#161513', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'clip' },
      showRequired: !!p.required && !has,
      open: this.state.open,
      items: opts.map(o => ({ label: o, pick: (e) => { e.stopPropagation(); this.setState({ open: false }); p.onChange && p.onChange(o); },
        style: { padding: '13px 17px', fontSize: '16px', color: '#161513', cursor: 'pointer', background: o === val ? '#e4eef4' : 'transparent', borderTop: o === val && opts.length > 3 ? '1px solid #55514d' : 'none' } })),
      onBoxClick: (e) => {
        if (kind === 'select') { this.setState(s => ({ open: !s.open })); p.onFocusField && p.onFocusField(); }
        else if (kind === 'text' || kind === 'textarea') { const el = e.currentTarget.querySelector('input,textarea'); el && el.focus(); }
      },
      onInput: (e) => p.onChange && p.onChange(e.target.value),
      onFocus: () => this.setState({ focus: true }),
      onBlur: () => this.setState({ focus: false })
    };
  }
}
</script>
</body>
</html>
